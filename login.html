<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فرم ورود به صفحه</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrapper">
    <form action="#">
      <h2>فرم ورود</h2>
      <div class="input-field">
        <input class="username" type="text" required onkeydown="usernameValidation()">
        <span class="username-validation">باید 12 کاراکتر یا بیشتر باشد</span>
        <label>ایمیل خود را وارد کنید</label>
      </div>
      <div class="input-field">
        <input class="password" type="password" required onkeydown="passwordValidation()">
        <span class="password-validation">باید 8 کاراکتر یا بیشتر باشد</span>
        <label>پسورد خود را وارد کنید</label>
      </div>
      <div class="forget">
        <label for="remember">
          <input type="checkbox" id="remember">
          <p>مرا بخاطر بسپار</p>
        </label>
        <a href="#">فراموشی رمز عبور</a>
      </div>
      <button onclick="dataValidation()" type="submit">ورود</button>
      <div class="register">
        <a href="#">ساخت اکانت جدید</a>
      </div>
    </form>
  </div>

  <div class="modal">
    لطفا اطلاعات لازم را به درستی وارد کنید
  </div>

  <script src="app.js"></script>
</body>

</html>
